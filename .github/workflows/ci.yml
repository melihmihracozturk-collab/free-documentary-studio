# Her push'ta testler: veritabanı + işçi testleri ve web uygulaması derlemesi.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: pip install -r worker/requirements.txt -r worker/requirements-dev.txt -r worker/requirements-audio.txt
      - run: python -m pytest -q worker/tests
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://postgres@localhost:5432/postgres

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
