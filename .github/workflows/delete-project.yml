# Bir projeyi KALICI olarak siler (veritabanı + R2 dosyaları). Geri alınamaz.
name: delete-project

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Silinecek projenin kısa adı"
        required: true
      confirm:
        description: "Onay: kısa adı tekrar yazın"
        required: true

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/delete-project.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SLUG: ${{ inputs.slug }}
          CONFIRM: ${{ inputs.confirm }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
