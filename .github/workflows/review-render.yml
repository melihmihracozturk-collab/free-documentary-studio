# Render kontrol görselini (9 kare) 1 gün saklanan bir Actions dosyası olarak çıkarır (kalite incelemesi için).
name: review-render

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Proje kısa adı"
        required: true
      kind:
        description: "doc / shorts"
        required: true
        default: doc

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r worker/requirements.txt
      - working-directory: worker
        run: |
          python - <<'PY'
          import os
          from fds_worker import storage
          k = os.environ["KIND"]
          key = storage.project_key(os.environ["SLUG"], "renders" if k == "doc" else "shorts", f"{k}_contact.jpg")
          storage.download(key, "../contact.jpg")
          print("indirildi:", key)
          PY
        env:
          SLUG: ${{ inputs.slug }}
          KIND: ${{ inputs.kind }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
      - uses: actions/upload-artifact@v4
        with:
          name: contact-${{ inputs.kind }}
          path: contact.jpg
          retention-days: 1
