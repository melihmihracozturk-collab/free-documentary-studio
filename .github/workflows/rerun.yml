# Bir projeyi belirtilen adımdan itibaren yeniden çalıştırır ve işçiyi başlatır.
name: rerun

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Proje kısa adı"
        required: true
      from_step:
        description: "Başlangıç adımı"
        required: true
        default: research_collect
        type: choice
        options: [research_collect, research_verify, research_report, script_doc, script_shorts, visual_plan, asset_match, subtitles, render_doc, render_shorts]
      format:
        description: "Biçimi değiştir (isteğe bağlı)"
        required: false
        default: keep
        type: choice
        options: [keep, documentary, vlog, review]

permissions:
  contents: read
  actions: write

jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate.mjs && node scripts/rerun.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SLUG: ${{ inputs.slug }}
          FROM_STEP: ${{ inputs.from_step }}
          FORMAT: ${{ inputs.format }}
      - name: İşçiyi başlat
        run: gh workflow run worker.yml --ref main -f reason=rerun
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
